<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style1.css">
        <style>
            
        </style>
    </head>
    <body>
        <script>
            function openForm() {
                document.getElementById("divscreen2").style.display = "block";
            }
            function closeForm() {
                document.getElementById("divscreen2").style.display = "none";
            }
            function getData() {
                var employeeid= document.getElementById("empid").value;
                var employeenam= document.getElementById("empName").value;
                //built a string with text and variable values and stored it in a new variable
                var newemp="Employee: "+employeeid+" Name: "+employeenam;
                document.getElementById("comment1").value=newemp;
                return;
            }
        </script>

        <h1>Maintain Employee Registration</h1>
        <button class="button" onclick="openForm()">Add New Employee</button>
        <br><br>
        <table>
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Country</th>
                <th>Zip Code</th>
            </tr>
            <tr>
                <td>Alfreds Futterkiste</td>
                <td>Maria Anders</td>
                <td>Germany</td>
                <td>234-1234</td>
            </tr>
            <tr>
                <td>Island Trading</td>
                <td>Helen Bennett</td>
                <td>UK</td>
                <td>234-1234</td>
            </tr>
            <tr>
                <td>Laughing Bacchus Winecellars</td>
                <td>Yoshi Tannamuri</td>
                <td>Canada</td>
                <td>234-1234</td>
            </tr>
            <tr>
                <td>Magazzini Alimentari Riuniti</td>
                <td>Giovanni Rovelli</td>
                <td>Italy</td>
                <td>234-1234</td>
            </tr>
        </table>
        <br><br>
        <input type="text" id="comment1" name="comment1" size="50">

        <div id=divscreen2 class="form-popup">
            <form name=screen2 action="" method="post" onsubmit="return false;">
                <label for="empid" class="required">Employee ID:</label>
                <input type="number" id="empid" name="empid" style="width: 6em" required>
                <br><br>
                <label for="empName" class="required">Name:</label>
                <input type="text" id="empName" name="empName" size="35" required>
                <br><br>
                <label>Sex:</label>
                <input type="radio" id="Female" name="Sex" value="F">
                Female
                <input type="radio" id="Male" name="Sex" value="M">
                Male
                <br><br>
                <label for="Age">Age:</label>
                <select name="Age" id="Age">
                <option value="0"></option>
                <option value="20">20 Years</option>
                <option value="21">21 Years</option>
                <option value="22">22 Years</option>
                <option value="23">23 Years</option>
                <option value="24" selected>24 Years</option>
                <option value="25">25 Years</option>
                </select>
                <br><br>
                <label for="empdate">Date Employed:</label>
                <input type="date" id="empdate" name="empdate">
                <br><br>
                <label for="comment">Comment:</label>
                <textarea id="comment" name="comment" rows="4" cols="30">
                </textarea>
                <br><br>
                <button class="button" onclick="getData()">Add Record</button>
                <button class="button" onclick="closeForm()">Cancel</button>
            </form>
        </div> 

    </body>
</html>
